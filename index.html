<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121413">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegFit">
  <meta name="format-detection" content="telephone=no">
  <title>RegFit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/today">
        <span class="brand-mark"></span>
        <span class="brand-name">RegFit</span>
      </a>
      <a class="nav-link" data-nav="today" href="#/today"><span class="nav-icon" data-icon="today"></span><span class="nav-label">Today</span><span class="nav-badge" id="today-badge"></span></a>
      <a class="nav-link" data-nav="clients" href="#/clients"><span class="nav-icon" data-icon="clients"></span><span class="nav-label">Clients</span></a>
      <a class="nav-link" data-nav="library" href="#/library"><span class="nav-icon" data-icon="dumbbell"></span><span class="nav-label">Exercise library</span></a>
      <div class="sidebar-foot">
        <a class="nav-link" data-nav="settings" href="#/settings"><span class="nav-icon" data-icon="settings"></span><span class="nav-label">Settings</span></a>
        <button type="button" class="side-btn side-btn-accent" data-act="newSession" aria-label="New session"><span data-icon="plus"></span><span class="nav-label">New session</span></button>
      </div>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <a class="tab" data-nav="today" href="#/today"><span data-icon="today"></span>Today</a>
      <a class="tab" data-nav="clients" href="#/clients"><span data-icon="clients"></span>Clients</a>
      <a class="tab" data-nav="library" href="#/library"><span data-icon="dumbbell"></span>Library</a>
      <a class="tab" data-nav="settings" href="#/settings"><span data-icon="settings"></span>Settings</a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="offline-bar" role="status">Offline — changes are saved here and sync when you’re back online</div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
